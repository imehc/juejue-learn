# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/getting-started/dependabot-quickstart-guide
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # pnpm workspace 设置 sharedWorkspaceLockfile: false，backend/frontend 各自维护
  # 独立的 pnpm-lock.yaml。因此不要在这里用根目录 "/" 的 npm entry 去更新 workspace
  # 依赖——它只会改 package.json 却无法同步子目录的 lockfile，导致 CI 因
  # ERR_PNPM_OUTDATED_LOCKFILE 失败。
  # 改为只给每个子项目单独配 npm entry，Dependabot 会各自更新对应子目录的
  # package.json 及其 pnpm-lock.yaml，保证两者同步、--frozen-lockfile 可用。
  - package-ecosystem: "npm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_backend"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_frontend"
    schedule:
      interval: "daily"
