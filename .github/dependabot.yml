# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/getting-started/dependabot-quickstart-guide
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # pnpm workspace 的根 lockfile 包含后端/前端所有依赖，
  # 用 pnpm ecosystem 才能让 Dependabot 正确解析 pnpm-lock.yaml
  - package-ecosystem: "pnpm"
    versioning-strategy: increase
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pnpm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_backend"
    schedule:
      interval: "daily"

  - package-ecosystem: "pnpm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_frontend"
    schedule:
      interval: "daily"
