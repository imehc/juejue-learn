# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/getting-started/dependabot-quickstart-guide
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # 合并或关闭 PR 后删掉 Dependabot 自己的远端分支，避免分支堆积。
    # 仓库级 delete_branch_on_merge 只覆盖“合并成功”这一条路径，
    # 这里补上“关闭但未合并”的情况，两者互补。
    delete-branch: true

  # pnpm workspace 设置 sharedWorkspaceLockfile: false，backend/frontend 各自维护
  # 独立的 pnpm-lock.yaml。因此不要在这里用根目录 "/" 的 npm entry 去更新 workspace
  # 依赖——它只会改 package.json 却无法同步子目录的 lockfile，导致 CI 因
  # ERR_PNPM_OUTDATED_LOCKFILE 失败。
  # 改为只给每个子项目单独配 npm entry，Dependabot 会各自更新对应子目录的
  # package.json 及其 pnpm-lock.yaml，保证两者同步、--frozen-lockfile 可用。
  - package-ecosystem: "npm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_backend"
    schedule:
      interval: "daily"
    delete-branch: true
    # @aws-sdk/* 内部共用 @smithy/* 类型，拆成多个 PR 单独升会让 @smithy/types
    # 出现两份副本，middlewareStack.add 的类型直接不兼容。必须同批升级。
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # Nest 的包互相钉 peerDependency（@nestjs/swagger 要求 core ^12、
      # @nestjs/typeorm 要求 common ^12），而且 @nestjs/schematics 把 TypeScript
      # 的大版本写成 peer（v12 → TS ^6）。任何一个单独升都会在安装阶段就 peer
      # 冲突，或者装上了却在运行期对不上，所以整组一起走、一次升级一个 PR。
      nestjs:
        patterns:
          - "@nestjs/*"
          - "typescript"

  - package-ecosystem: "npm"
    versioning-strategy: increase
    directory: "/meeting_room_booking_system_frontend"
    schedule:
      interval: "daily"
    delete-branch: true
