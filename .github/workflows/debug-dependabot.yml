name: Debug Dependabot Context

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-context:
    runs-on: ubuntu-latest
    steps:
      - name: Print context values
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_USER_NODE_ID: ${{ github.event.pull_request.user.node_id }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.author.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "github.actor = [$ACTOR]"
          echo "github.event_name = [$EVENT_NAME]"
          echo "github.event.pull_request.user.login = [$PR_USER_LOGIN]"
          echo "github.event.pull_request.user.node_id = [$PR_USER_NODE_ID]"
          echo "github.event.pull_request.author.login = [$PR_AUTHOR_LOGIN]"
          echo "github.head_ref = [$HEAD_REF]"
