name: CI for Fronted and Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一个 PR 上的新 push 取消掉还在跑的旧 run；push 到 main 不取消
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 判断这次改动碰到了哪个子项目，只跑对应的 build/test
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
            backend:
              - *shared
              - 'meeting_room_booking_system_backend/**'
            frontend:
              - *shared
              - 'meeting_room_booking_system_frontend/**'
              # 前端构建要用后端的 openapi.yaml 生成 API 客户端
              - 'meeting_room_booking_system_backend/openapi.yaml'

  build-backend-with-nestjs:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本要满足根 package.json 的 engines（pnpm >=10、node >=20），
      # 否则 pnpm 直接以 ERR_PNPM_UNSUPPORTED_ENGINE 退出，
      # 后续步骤拿不到 nest/jest 二进制，门禁会变成空跑
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Nest.js setup script
        run: bash ./.github/scripts/backend-setup.sh

  build-fronted-with-nextjs:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Next.js setup script
        run: bash ./.github/scripts/frontend-setup.sh

  # 汇总门禁：被 paths 过滤跳过的 build job 算通过，失败/取消算不通过。
  # changes 必须 success —— 否则 build job 全被跳过，门禁会被“空跑”骗过去。
  # 该 job 是唯一的总闸：auto-merge.yml 会轮询 "ci-gate" 这个 check 通过后再合并。
  ci-gate:
    needs:
      - changes
      - build-backend-with-nestjs
      - build-fronted-with-nextjs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.build-backend-with-nestjs.result }}
          FRONTEND: ${{ needs.build-fronted-with-nextjs.result }}
        run: |
          echo "changes=$CHANGES backend=$BACKEND frontend=$FRONTEND"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::change detection did not succeed ($CHANGES)"
            exit 1
          fi
          for r in "$BACKEND" "$FRONTEND"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI gate failed (job result: $r)"; exit 1 ;;
            esac
          done
          echo "CI gate passed."
