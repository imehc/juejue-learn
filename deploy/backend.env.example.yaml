# ─────────────────────────────────────────────────────────────
# 后端应用配置模板
#
# 后端按 NODE_ENVIRONMENT 选择读取哪个文件
# （见 meeting_room_booking_system_backend/src/config/configuration.ts）：
#   NODE_ENVIRONMENT=production  →  .env.yaml
#   其它（含未设置）              →  .env.dev.yaml
#
# 生产部署（后端在容器里，配置由 compose 以只读方式挂进去）：
#   cd deploy && cp backend.env.example.yaml backend.env.yaml
#   host 要改成 compose 的服务名，每处都在下面用「生产环境」注释标出
#
# 本地开发（后端跑在主机上，配置放在后端目录里）：
#   cp deploy/backend.env.example.yaml \
#      meeting_room_booking_system_backend/.env.dev.yaml
#   基础设施跑在容器里、端口映射到主机，所以 host 保持 localhost
#
# deploy/backend.env.yaml 和后端目录下的 .env.dev.yaml / .env.yaml
# 都已被 .gitignore 忽略，不要提交。
# ─────────────────────────────────────────────────────────────

# redis 配置
redis-server:
  host: localhost # 生产环境改为 redis
  port: 6379
  db: 1

# mysql 配置
mysql-server:
  host: localhost # 生产环境改为 mysql
  port: 3306
  username: root
  # 需与 deploy/.env 里的 MYSQL_ROOT_PASSWORD 一致
  password: replace-with-a-strong-password
  # 需与 deploy/.env 里的 MYSQL_DATABASE 一致
  database: meeting_room_booking_system

# 对象存储配置。后端用 AWS 官方 S3 SDK（@aws-sdk/client-s3）走标准
# S3 协议访问，当前实现是 RustFS，换成任何 S3 兼容服务都不用改代码。
oss-server:
  endpoint: localhost # 生产环境改为 rustfs
  port: 9000
  # 自建服务一般是明文 HTTP；接真 AWS S3 或带 TLS 的网关时改 true
  use-ssl: 'false'
  # 自建 S3 没有 region 概念，但 SDK 强制要求；需与建桶时用的 region
  # 一致（deploy 里的 rustfs-init 用 us-east-1）
  region: us-east-1
  # 需与 deploy/.env 里的 RUSTFS_ACCESS_KEY 一致
  access-key: replace-me
  # 需与 deploy/.env 里的 RUSTFS_SECRET_KEY 一致
  secret-key: replace-with-a-strong-secret
  # 需与 deploy/.env 里的 RUSTFS_BUCKET 一致
  bucket-name: meeting-room-booking-system
  # 预签名上传链接有效期（秒）
  expires: 3600

# nodemailer 配置（发验证码邮件用）
# Outlook / Gmail 都需要「应用专用密码」，不是登录密码
nodemailer-server:
  host: smtp-mail.outlook.com
  port: 587
  user: your-account@outlook.com
  pass: your-app-password

# winston 日志配置
winston:
  log-level: debug # 生产环境建议改为 info
  log-dirname: daily-log # 文件夹名称
  log-filename: log-%DATE%.log
  log-date-pattern: YYYY-MM-DD
  log-max-size: 1M

# google 第三方登录配置
# 不需要第三方登录可留占位值，只有真正走该登录流程时才会用到
google:
  login:
    client-id: your-google-client-id
    client-secret: your-google-client-secret
    # 生产环境（走 nginx）用 http://nginx/user/callback/google
    callback-url: http://localhost:6020/user/callback/google
    # 登录成功后跳回前端的地址
    # 生产环境改为 http://localhost（nginx 的 80 端口）
    redirect-url: http://localhost:6021

# github 第三方登录配置
github:
  login:
    client-id: your-github-client-id
    client-secret: your-github-client-secret
    # 生产环境（走 nginx）用 http://nginx/user/callback/github
    callback-url: http://localhost:6020/user/callback/github
    # redirect-url 必须与 GitHub OAuth App 注册的回调地址匹配
    # 生产环境改为 http://localhost
    redirect-url: http://localhost:6021

# jwt 配置
jwt:
  # 生产环境务必替换为随机串，例如 openssl rand -hex 32
  secret: replace-with-a-random-secret
  access-token-expires-time: 30m
  access-refresh-expires-time: 7d

# nest 配置
nest-server:
  port: 6020
  # Swagger 文档里显示的服务地址
  doc-url: http://127.0.0.1:6020
